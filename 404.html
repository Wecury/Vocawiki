<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 - 页面未找到 | Vocawiki</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .err-page {
      min-height: 72vh;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 80px 24px;
    }
    .err-code {
      font-size: clamp(80px, 16vw, 160px);
      font-weight: 800;
      line-height: 1;
      background: var(--accent-grad);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .err-page h1 {
      font-size: 26px;
      margin: 18px 0 10px;
    }
    .err-page p {
      color: var(--text-soft);
      margin-bottom: 30px;
    }
    .err-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
    }
  </style>
</head>
<body>
  <div class="bg-decor" aria-hidden="true">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="grid-overlay"></div>
  </div>

  <main class="err-page">
    <div>
      <div class="err-code">404</div>
      <h1>页面走丢了</h1>
      <p>你访问的页面不存在或已被移动，返回首页继续逛逛吧～</p>
      <div class="err-actions">
        <a class="btn btn-primary" href="./">返回首页</a>
        <a class="btn btn-ghost" href="https://voca.wiki/" target="_blank" rel="noopener">前往 Vocawiki 主站</a>
      </div>
    </div>
  </main>
</body>
</html>
